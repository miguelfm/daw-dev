# Aula: Apache con permisos estritos, como nun servidor Debian, e os datos das
# tarefas fóra da raíz web. daw-start le este ficheiro porque está ao lado de compose.yaml;
# Dev Containers, porque o nomea .devcontainer/devcontainer.json.
services:
  web:
    environment:
      # Apache executa PHP como www-data, como en Debian
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
    volumes:
      # Os ficheiros que len ou escriben as tarefas, fóra da raíz web
      - ./data:/home/ad/data
      - ./docker/classroom/zz-classroom.ini:/usr/local/etc/php/conf.d/zz-classroom.ini:ro
      # Extensións de VS Code do Dev Container: a activación instálaas desde o paquete, sen
      # Internet, e consérvanse aínda que se volva crear o contedor.
      - vscode-extensions:/home/ad/.vscode-server/extensions
    command:
      - bash
      - -c
      - |
        # Apache non herda os permisos de escritura do grupo do alumnado.
        grupo=$(id -gn ad) || exit 1
        if [ "$$grupo" != www-data ] && id -Gn www-data | tr ' ' '\n' | grep -Fxq "$$grupo"; then
          gpasswd -d www-data "$$grupo" || exit 1
        fi
        # A máscara de Apache en Debian: o que crea www-data
        # pódeno ler os demais, pero só el o cambia (a imaxe pon 002)
        sed -i 's/^umask 002$$/umask 022/' /etc/apache2/envvars
        install -d -m 1733 /var/lib/php/sessions
        exec apache2-foreground

volumes:
  vscode-extensions:
    # Nome fixo: install-user.ps1 énchea antes de crear o contedor.
    name: daw-vscode-extensions
