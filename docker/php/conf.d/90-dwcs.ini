; Axustes de desenvolvemento para DWCS (sobrescriben php.ini-development)

date.timezone = Europe/Madrid
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
; Os erros van á saída de Apache: `docker compose logs -f web`
error_log = /proc/self/fd/2

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60

; OPcache: revalida os ficheiros en cada petición para que os cambios
; se vexan ao momento ao recargar o navegador
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
