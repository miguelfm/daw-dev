; Xdebug 3. A extensión xa a activa install-php-extensions (docker-php-ext-xdebug.ini).
; O modo pódese cambiar sen reconstruír a imaxe coa variable XDEBUG_MODE do .env
; (debug, develop, coverage, profile, off...).

xdebug.mode = debug,develop
; yes: depura todas as peticións (abondo con F5 en VS Code e recargar).
; trigger: só cando a petición leva XDEBUG_TRIGGER (extensión do navegador).
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false
; 0 = só erros críticos: evita avisos "Could not connect to debugging client"
; cando o IDE non está escoitando. Para diagnosticar: log_level = 7
xdebug.log_level = 0
