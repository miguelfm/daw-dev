name: Classroom scripts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tests/classroom.ps1
  windows-powershell7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell 7 Windows
        shell: pwsh
        run: ./tests/classroom.ps1
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell regression tests
        shell: pwsh
        run: ./tests/classroom.ps1
      - name: Actual project overlay in isolated fixtures
        run: python3 tests/overlay.py
      - name: Actual web root backup and restore in isolated fixtures
        run: python3 tests/webroot.py
      - name: Actual VS Code Server install in isolated fixtures
        run: python3 tests/codeserver.py
      - name: Actual project move from ~/workspace to ~/daw in isolated fixtures
        run: python3 tests/projectmove.py
      - name: Dev Containers CLI
        run: |
          node --version
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/devcontainers" @devcontainers/cli@0.91.0
          echo "DEVCONTAINER_BIN=$RUNNER_TEMP/devcontainers/node_modules/.bin/devcontainer" >> "$GITHUB_ENV"
      - name: daw-start and Dev Containers on one web container, with real Docker
        run: |
          "$DEVCONTAINER_BIN" --version
          docker compose version
          python3 tests/devcontainer.py
