name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Cada luns: reconstrúe as imaxes coas actualizacións de seguridade de PHP e Debian
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probas:
    name: Probas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: UID/GID do runner para a imaxe
        run: |
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Comprobar a contorna
        run: ./scripts/comprobar.sh --build

      - name: Logs se algo falla
        if: failure()
        run: docker compose logs --tail 100

  publicar:
    name: Publicar imaxe
    needs: probas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PHP_VERSION: "8.5"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ env.PHP_VERSION }}
          labels: |
            org.opencontainers.image.title=daw-dev
            org.opencontainers.image.description=Contorna PHP ${{ env.PHP_VERSION }} (Apache) para desenvolvemento web en DAW

      # Imaxe co UID/GID 1000, o habitual no primeiro usuario de Linux e de WSL
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
