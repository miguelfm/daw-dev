name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Cada luns: reconstrúe as imaxes coas actualizacións de seguridade de PHP e Debian
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.6"

jobs:
  probas:
    name: Probas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: UID/GID do runner para a imaxe
        run: |
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Comprobar a contorna
        run: ./scripts/comprobar.sh --build

      - name: Comprobar as versións de PHP e Xdebug
        run: |
          docker compose exec -T web php --version
          test "$(docker compose exec -T web php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_VERSION"
          docker compose exec -T web php -r 'exit(str_starts_with((string) phpversion("xdebug"), "3.6.") ? 0 : 1);'

      - name: Logs se algo falla
        if: failure()
        run: docker compose logs --tail 100

  publicar:
    name: Publicar imaxe
    needs: probas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository_owner }}/dwcs-php
          tags: type=raw,value=${{ env.PHP_VERSION }}
          labels: |
            org.opencontainers.image.title=daw-dev
            org.opencontainers.image.description=Contorna PHP ${{ env.PHP_VERSION }} (Apache) para desenvolvemento web en DAW

      # Imaxe co UID/GID 1000, o habitual no primeiro usuario de Linux e de WSL
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  angular:
    name: Imaxe Angular (DWCC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Node.js 26 e Angular CLI 22, sen SSH; nas PR só se constrúe e proba
      - uses: docker/build-push-action@v7
        with:
          context: docker/angular
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/dwcc-angular:22
          labels: |
            org.opencontainers.image.title=dwcc-angular
            org.opencontainers.image.description=Node.js e Angular CLI para DWCC en DAW Dev
          cache-from: type=gha,scope=angular
          cache-to: type=gha,mode=max,scope=angular

      # daw.ps1 distingue esta imaxe da anterior (con SSH, como root) polo usuario node.
      - name: Comprobar Node, Angular CLI e o usuario node
        run: |
          docker run --rm --entrypoint sh ghcr.io/${{ github.repository_owner }}/dwcc-angular:22 \
            -c 'node --version && ng version | grep -q "Angular CLI" && test "$(id -un):$(id -u)" = node:1000 && test -w /home/node/proxectos && test ! -e /usr/sbin/sshd'
          test "$(docker image inspect --format '{{.Config.User}}' ghcr.io/${{ github.repository_owner }}/dwcc-angular:22)" = node

      - name: Publicar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository_owner }}/dwcc-angular:22
