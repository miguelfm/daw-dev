# Aula de DWCS: o contedor web compórtase como a MV Debian da aula.
# daw-start le este ficheiro porque está ao lado de compose.yaml;
# Dev Containers, porque o nomea .devcontainer/devcontainer.json.
services:
  web:
    environment:
      # Apache executa PHP como www-data, igual ca na MV
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
    volumes:
      # As rutas da MV: a raíz web e os datos fóra dela
      - ${WWW_DIR:-./www}:/home/ad/html
      - ./datos:/home/ad/datos
      - ./docker/aula/zz-aula.ini:/usr/local/etc/php/conf.d/zz-aula.ini:ro
      - ./docker/aula/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    command:
      - bash
      - -c
      - |
        # www-data fóra do grupo dev, e o directorio de sesións de Debian
        gpasswd -d www-data dev >/dev/null 2>&1 || true
        # A máscara de Apache na MV, a de Debian: o que crea www-data
        # pódeno ler os demais, pero só el o cambia (a imaxe pon 002)
        sed -i 's/^umask 002$$/umask 022/' /etc/apache2/envvars
        install -d -m 1733 /var/lib/php/sessions
        exec apache2-foreground
