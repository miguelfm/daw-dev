; Aula de DWCS: os valores do 99-dev.ini de Apache na MV da aula.
; O nome zz- fai que se lea despois de 90-daw-dev.ini e 99-xdebug.ini.
output_buffering = Off
post_max_size = 32M
upload_max_filesize = 32M
max_input_time = 60
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.save_path = /var/lib/php/sessions
; Como Debian: PHP non borra as sesións vellas. O directorio é 1733 e
; www-data non pode listalo, e o borrado daría un Notice nunha de cada
; mil peticións (ps_files_cleanup_dir: opendir ... Permission denied)
session.gc_probability = 0
opcache.enable = 0
xdebug.start_with_request = trigger
